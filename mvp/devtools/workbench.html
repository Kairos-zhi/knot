<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Knot · 探索工作台</title>
<style>
:root{color-scheme:light dark;--bg:#f6f7f9;--panel:#fff;--ink:#1e2530;--muted:#606b7c;--line:#dce1e9;--accent:#315cda;--soft:#eaf0ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,sans-serif}header{padding:24px 32px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}h1{font-size:22px;margin:0}h2{font-size:17px;margin:0 0 16px}h3{font-size:15px}p{margin:8px 0;color:var(--muted)}main{display:grid;grid-template-columns:260px minmax(0,1fr);max-width:1440px;margin:auto;min-height:70vh}aside{padding:24px;border-right:1px solid var(--line)}section{padding:24px;min-width:0}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:20px}.bar{display:flex;gap:10px;align-items:end;flex-wrap:wrap}button,input{font:inherit;border:1px solid var(--line);border-radius:8px;padding:9px 12px;color:var(--ink);background:var(--panel);max-width:100%}button{cursor:pointer}button:disabled{opacity:.55;cursor:default}button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}label{display:flex;flex-direction:column;gap:5px;min-width:0}input{width:100%}.grow{flex:1;min-width:160px}.badge{background:var(--soft);color:var(--accent);padding:5px 10px;border-radius:20px;align-self:center}#list{display:grid;gap:10px;margin-top:16px}#list button{text-align:left;overflow-wrap:anywhere}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;margin:12px 0}code,.id{font:12px/1.6 ui-monospace,monospace;overflow-wrap:anywhere}.material{border-top:1px solid var(--line);padding:16px 0;display:grid;gap:8px}.relation{border-left:3px solid var(--accent);padding:8px 16px;margin:12px 0;overflow-wrap:anywhere}#notice{min-height:28px;padding:12px 32px}#notice[data-error=true]{color:#bc3038}.roadmap{font-size:13px;padding-top:24px}small{color:var(--muted)}@media(prefers-color-scheme:dark){:root{--bg:#11151c;--panel:#1b212b;--ink:#e4e9f1;--muted:#a8b3c4;--line:#343e4d;--accent:#94afff;--soft:#25334f}button.primary{color:#11151c}}@media(max-width:760px){main{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line)}header,section,aside{padding:18px}#notice{padding:10px 18px}}
</style></head><body>
<header><div><h1>Knot <span style="font-weight:400">/ 探索工作台</span></h1><p>把材料、关系与停点放回同一个工作现场。</p></div><span class="badge">本地只读 · 开发候选</span></header>
<div id="notice" role="status" aria-live="polite">选择“刷新探索”开始。本页尚未读取业务数据。</div>
<main><aside><h2>我的探索</h2><button id="refresh" class="primary">刷新探索</button><div id="list"></div><div class="roadmap"><h3>插件开发日程</h3><p>当前：资料与探索可视化</p><p>随后：显式保存与返回恢复</p><p>待定义：项目识别、用户确认与平台同步</p></div></aside>
<section><div class="panel"><h2>返回一个停点</h2><div class="bar"><label class="grow">探索 ID<input id="exploration" placeholder="从左侧选择，或输入已有 ID"></label><label>历史版本（可选）<input id="revision" inputmode="numeric" placeholder="留空读取当前版本"></label><button id="load">加载停点</button></div><div id="checkpoint"><p>加载后显示保存版本、材料和关系。正文需逐次选择阅读。</p></div></div>
<div class="panel"><h2>查找资料</h2><div class="bar"><label class="grow">字面关键词<input id="query" placeholder="短文本范围内查找"></label><button id="search">查找</button></div><p>长文请使用已知资产 ID 和内容哈希。无命中仅说明本次短文本查找未命中。</p><div id="results"></div></div>
<div class="panel"><h2>逐页阅读与回源</h2><div class="bar"><label class="grow">资产 ID<input id="asset"></label><label class="grow">完整内容 SHA-256<input id="hash"></label></div><div class="bar" style="margin-top:12px"><label>起始字节<input id="offset" value="0" inputmode="numeric"></label><label>单页字节<input id="limit" value="4096" inputmode="numeric"></label><button id="read" class="primary">读取这一页</button><button id="next" disabled>读取下一页</button><button id="source">查看记录来源</button></div><p>阅读结果保留在当前页面；刷新即清空。来源标签尚未验证原聊天真实性。</p><small id="page-meta"></small><pre id="body"></pre><pre id="source-result"></pre></div>
</section></main>
<script id="workbench-code">
'use strict';
const $ = id => document.getElementById(id);
let pageAnchor = null;
let busy = false;
const errors = {ACCESS_DENIED:'当前身份无权读取，请检查 reader 授权。',NOT_FOUND:'未找到该探索或版本。',INVALID_ARGUMENTS:'参数或内容哈希不符合要求，请核对输入。',UPSTREAM_ERROR:'后端未返回可验证结果，请检查服务后再次显式操作。',READ_LIMIT_REACHED:'读取达到限制，请缩小范围。',SENSITIVE_CONTENT:'结果含凭据标记，已停止展示。',VERSION_CONFLICT:'此服务版本不支持当前操作。'};
async function get(action, params = {}) {
  const result = await fetch('/api/' + action + '?' + new URLSearchParams(params), {cache:'no-store'});
  const value = await result.json();
  if (!result.ok || value.error) throw Error(errors[value.error] || '操作未完成，请检查服务和输入。');
  return value;
}
function notice(message, error=false){$('notice').textContent=message;$('notice').dataset.error=String(error);}
function text(parent, tag, value, cls){const node=document.createElement(tag);node.textContent=value;if(cls)node.className=cls;parent.append(node);return node;}
function choose(id, hash){$('asset').value=id;$('hash').value=hash;$('offset').value='0';pageAnchor=null;$('next').disabled=true;$('body').textContent='';$('page-meta').textContent='';$('source-result').textContent='';}
function material(parent, ref){const row=document.createElement('div');row.className='material';parent.append(row);text(row,'span',(ref.disposition==='excluded'?'已排除':'已选入')+' · '+(ref.status||'查找结果'));text(row,'code',ref.asset_id);text(row,'code',ref.expected_content_hash||ref.content_hash);if(ref.reason)text(row,'p',ref.reason);const pick=text(row,'button','选择此材料');pick.disabled=ref.status&&ref.status!=='available';pick.addEventListener('click',()=>choose(ref.asset_id,ref.expected_content_hash||ref.content_hash));}
function showCheckpoint(v){const host=$('checkpoint');host.replaceChildren();text(host,'h3','保存版本 '+v.revision+' · '+(v.origin?'由历史分岔':'独立探索'));text(host,'code',v.exploration_id);if(v.origin)text(host,'p','源探索 '+v.origin.source_exploration_id+' / 版本 '+v.origin.source_revision);text(host,'h3','停点');text(host,'pre',v.stop_note===null?(v.stop_note_reason?'依赖不可用或内容受限，停点暂不展示。':'未填写停点。'):v.stop_note);text(host,'h3','材料顺序');if(!v.references.length)text(host,'p','此版本未保存材料。');v.references.forEach(r=>material(host,r));text(host,'h3','材料关系');if(!v.relations.length)text(host,'p','此版本未保存关系。');v.relations.forEach(r=>{const row=document.createElement('div');row.className='relation';host.append(row);text(row,'div',r.label||'关联内容暂不展示');text(row,'code',r.from_asset_id+' → '+r.to_asset_id);if(r.reason)text(row,'p',r.reason);if(r.reason_code)text(row,'p',r.reason_code);});}
function action(id, handler){$(id).addEventListener('click',async()=>{if(busy)return;busy=true;const controls=Array.from(document.querySelectorAll('button,input'));const previous=controls.map(n=>[n,n.disabled]);controls.forEach(n=>n.disabled=true);notice('正在读取…');try{await handler();notice('读取完成。');}catch(e){notice(e.message,true);}finally{previous.forEach(([n,disabled])=>n.disabled=disabled);$('next').disabled=!pageAnchor;busy=false;}});}
action('refresh',async()=>{const v=await get('explorations');$('list').replaceChildren();if(!v.items.length)text($('list'),'p','当前身份没有可见探索。');v.items.forEach(item=>{const b=text($('list'),'button',item.exploration_id+' · 版本 '+item.revision);b.addEventListener('click',()=>{$('exploration').value=item.exploration_id;$('revision').value='';notice('已选择探索，点击加载停点。');});});});
action('load',async()=>{const p={exploration_id:$('exploration').value.trim()};if($('revision').value.trim())p.revision=$('revision').value.trim();$('checkpoint').replaceChildren();showCheckpoint(await get('checkpoint',p));});
action('search',async()=>{const host=$('results');host.replaceChildren();const v=await get('search',{query:$('query').value});if(!v.items.length)text(host,'p','本次短文本查找无命中；较早历史或长文可能不在此范围。');v.items.forEach(r=>material(host,r));if(v.has_more)text(host,'p','仅显示首批结果，请缩小关键词范围。');});
function anchor(){return {asset_id:$('asset').value.trim(),expected_hash:$('hash').value.trim()};}
['asset','hash','offset','limit'].forEach(id=>$(id).addEventListener('input',()=>{pageAnchor=null;$('next').disabled=true;$('body').textContent='';$('page-meta').textContent='';$('source-result').textContent='';}));
async function read(p){pageAnchor=null;$('next').disabled=true;$('body').textContent='';$('page-meta').textContent='';const v=await get('slice',p);$('body').textContent=v.text;$('page-meta').textContent='字节 '+v.offset+'–'+v.next_offset+' / '+v.total_bytes;pageAnchor=v.has_more?{...p,offset:String(v.next_offset)}:null;$('next').disabled=!pageAnchor;}
action('read',()=>read({...anchor(),offset:$('offset').value,limit:$('limit').value}));
action('next',async()=>{if(pageAnchor)await read({...pageAnchor});});
action('source',async()=>{$('source-result').textContent='';const v=await get('source',anchor());$('source-result').textContent=v.source_status==='recorded_file_reference'?v.relative_path+'（原来源未经验证）':'来源未知 · '+v.reason;});
</script></body></html>
