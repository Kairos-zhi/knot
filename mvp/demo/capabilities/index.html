<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'">
<title>Knot · 开发贡献回顾</title>
<style>
  :root {
    color-scheme: light;
    --paper: #f6f4ed;
    --card: #fffefa;
    --ink: #202c24;
    --muted: #505e53;
    --edge: #d9ded3;
    --accent: #23533d;
    --mint: #e2eee4;
    --amber: #f6eaca;
    --brown: #67491f;
  }
  * { box-sizing: border-box; }
  body { margin: 0; color: var(--ink); background: var(--paper); font: 16px/1.65 system-ui, "Microsoft YaHei", sans-serif; }
  a { color: var(--accent); text-underline-offset: .24em; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .wrap { max-width: 1120px; margin: auto; padding-inline: clamp(18px, 5vw, 54px); }
  .top { border-bottom: 1px solid var(--edge); }
  .top .wrap, .hero, .card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; }
  .top .wrap { min-height: 62px; align-items: center; flex-wrap: wrap; padding-block: 10px; }
  .brand { color: var(--accent); font-size: 15px; font-weight: 750; letter-spacing: .06em; }
  nav { display: flex; flex-wrap: wrap; gap: 18px; font-size: 14px; }
  .hero { align-items: flex-end; flex-wrap: wrap; padding-block: 46px 34px; border-bottom: 1px solid var(--edge); }
  h1, h2, h3, p { margin: 0; }
  h1 { margin: 6px 0 8px; font-size: clamp(33px, 6vw, 56px); line-height: 1.16; letter-spacing: -.045em; }
  h2 { font-size: 26px; line-height: 1.3; margin-bottom: 6px; }
  h3 { font-size: 19px; line-height: 1.4; }
  .muted { color: var(--muted); }
  .badge { display: inline-block; background: var(--mint); color: var(--accent); border-radius: 4px; padding: 2px 8px; font-size: 12px; font-weight: 700; white-space: nowrap; }
  .forming, .pilot { color: var(--brown); background: var(--amber); }
  .missing { color: var(--muted); background: #eeeee8; }
  .period { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
  select { color: var(--ink); background: var(--card); border: 1px solid #8c9b8d; border-radius: 6px; padding: 8px; font: inherit; }
  section { padding-block: 30px 8px; }
  .intro { color: var(--muted); font-size: 14px; margin-bottom: 16px; }
  .capabilities, .projects { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; align-items: start; }
  .projects { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  article { min-width: 0; background: var(--card); border: 1px solid var(--edge); border-radius: 10px; padding: 18px; }
  .project { border-top: 3px solid #9bb5a0; }
  .project > p { margin-block: 8px 10px; font-size: 14px; }
  .scope { color: var(--muted); font-size: 14px; margin-top: 5px; }
  .coverage { display: flex; align-items: baseline; gap: 6px; color: var(--muted); font-size: 13px; margin-top: 10px; flex-wrap: wrap; }
  .coverage strong { color: var(--ink); font-size: 24px; font-variant-numeric: tabular-nums; }
  .coverage span { margin-left: auto; }
  .trend { list-style: none; padding: 0; margin: 6px 0 12px; display: flex; gap: 5px; }
  .trend li { flex: 1; min-width: 0; padding: 4px 6px; border-bottom: 3px solid #92af99; border-radius: 4px; background: #eef4eb; text-align: center; font-size: 12px; }
  .trend li.zero { border-color: var(--edge); background: #f0f0e9; color: var(--muted); }
  .trend li strong { display: block; font-size: 14px; font-variant-numeric: tabular-nums; }
  details { border-top: 1px solid var(--edge); padding-block: 8px 2px; font-size: 14px; }
  details + details { margin-top: 5px; }
  summary { cursor: pointer; color: var(--accent); font-weight: 650; }
  .cases { list-style: none; margin: 8px 0 0; padding: 0; }
  .cases li { border-left: 2px solid var(--edge); padding: 0 0 0 9px; margin: 0 0 12px; overflow-wrap: anywhere; }
  .source { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .quote { margin-bottom: 4px; }
  .gap { color: var(--brown); font-size: 13px; margin-block: 6px; }
  .requirement { display: block; font-size: 13px; }
  footer { color: var(--muted); margin-top: 24px; border-top: 1px solid var(--edge); padding-block: 16px 26px; font-size: 13px; }
  @media (max-width: 870px) { .projects { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 620px) {
    .hero { padding-block: 30px 22px; }
    .capabilities, .projects { grid-template-columns: 1fr; }
    .card-head { gap: 8px; flex-wrap: wrap; }
  }
</style>
</head>

<script id="review-engine">
"use strict";

const evidenceKinds = { test: "测试回执", review: "核对记录", agent: "Agent 自述" };
const levels = {
  repeated: { label: "跨项目已复现" },
  forming: { label: "形成中", gap: "待核另一独立项目中的同类贡献。" },
  missing: { label: "待补证据", gap: "待取得可归属且已核对的测试回执或核对记录。" }
};
const recommendations = { priority: "优先了解", pilot: "可先试做", missing: "暂缓匹配" };

function isChecked(source) {
  return source.reviewed === true && (source.kind === "test" || source.kind === "review");
}

function buildReview(data, through) {
  const stages = data.stages.slice(0, through + 1);
  const end = stages.at(-1).end;
  const visible = data.contributions.map(record => ({
    ...record,
    sources: record.sources.filter(source => source.on <= end)
  }));
  const capabilities = data.capabilities.map(capability => {
    const records = visible.filter(record => record.capability === capability.id);
    const checked = [];
    const pending = [];
    const firstByProject = new Map();
    for (const record of records) {
      const verified = record.sources.filter(isChecked);
      const unverified = record.sources.filter(source => !isChecked(source));
      if (unverified.length) pending.push({ ...record, sources: unverified });
      if (!verified.length) continue;
      verified.sort((a, b) => a.on.localeCompare(b.on));
      const first = verified[0].on;
      checked.push({ ...record, first, sources: verified });
      if (!firstByProject.has(record.project) || first < firstByProject.get(record.project)) {
        firstByProject.set(record.project, first);
      }
    }
    const dates = [...firstByProject.values()];
    const trend = stages.map((stage, index) => ({
      label: stage.label,
      added: dates.filter(date => date <= stage.end && (index === 0 || date > stages[index - 1].end)).length,
      total: dates.filter(date => date <= stage.end).length
    }));
    const level = dates.length >= 2 ? "repeated" : dates.length === 1 ? "forming" : "missing";
    checked.sort((a, b) => b.first.localeCompare(a.first) || a.id.localeCompare(b.id));
    const representative = new Map();
    for (const record of checked) if (!representative.has(record.project)) representative.set(record.project, record);
    const cases = [...representative.values()];
    return { ...capability, level, count: dates.length, checked, pending, cases, trend };
  });
  const byCapability = new Map(capabilities.map(capability => [capability.id, capability]));
  const matches = data.requests.map(request => {
    const requirements = request.requirements.map(item => ({ ...item, capability: byCapability.get(item.capability) }));
    const covered = requirements.filter(item => item.capability.level === "repeated").length;
    const evidenced = requirements.filter(item => item.capability.count > 0).length;
    const status = covered === requirements.length ? "priority" : evidenced === requirements.length ? "pilot" : "missing";
    return { ...request, requirements, covered, evidenced, status };
  });
  matches.sort((a, b) =>
    b.covered / b.requirements.length - a.covered / a.requirements.length ||
    b.evidenced / b.requirements.length - a.evidenced / a.requirements.length ||
    a.id.localeCompare(b.id));
  const checkedProjects = new Set(capabilities.flatMap(capability => capability.checked.map(record => record.project)));
  const checkedHosts = new Set(capabilities.flatMap(capability => capability.checked.flatMap(record => record.sources.map(source => source.host))));
  return { end, capabilities, matches, projects: checkedProjects.size, hosts: checkedHosts.size };
}
</script>
<script id="review-page">
"use strict";

const demo = JSON.parse(document.getElementById("fixture").textContent);
const period = document.getElementById("period");

function element(tag, content, className) {
  const node = document.createElement(tag);
  if (content !== undefined) node.textContent = content;
  if (className) node.className = className;
  return node;
}

function disclosure(label) {
  const detail = element("details");
  detail.append(element("summary", label));
  return detail;
}

function evidenceList(records) {
  const list = element("ul", undefined, "cases");
  for (const record of records) {
    const item = element("li");
    item.append(element("strong", demo.projects[record.project]), element("p", record.summary));
    for (const source of record.sources) {
      const status = isChecked(source) ? "已核" : "待核";
      const location = ["合成", status, source.id, demo.hosts[source.host], source.on, evidenceKinds[source.kind], source.ref].join(" · ");
      item.append(element("p", location, "source"), element("p", "“" + source.quote + "”", "quote"));
    }
    item.append(element("p", "案例缺口 · " + record.gap, "gap"));
    list.append(item);
  }
  return list;
}

function capabilityCard(capability) {
  const level = levels[capability.level];
  const card = element("article");
  const head = element("div", undefined, "card-head");
  head.append(element("h3", capability.label), element("span", level.label, "badge " + capability.level));
  card.append(head, element("p", capability.scope, "scope"));

  const coverage = element("p", undefined, "coverage");
  coverage.append(element("strong", capability.count), "个项目有已核证据", element("span", "各阶段新增 / 累计"));
  const trend = element("ol", undefined, "trend");
  for (const stage of capability.trend) {
    const cell = element("li", stage.label, stage.total ? "" : "zero");
    cell.append(element("strong", "+" + stage.added + " / " + stage.total));
    trend.append(cell);
  }
  card.append(coverage, trend);
  if (level.gap) card.append(element("p", level.gap, "gap"));
  if (capability.cases.length) {
    const names = capability.cases.map(record => demo.projects[record.project]).join("、");
    const detail = disclosure("代表案例 · " + names);
    detail.append(evidenceList(capability.cases));
    card.append(detail);
  }
  if (capability.checked.length > capability.cases.length) {
    const detail = disclosure("更多已核贡献");
    detail.append(evidenceList(capability.checked.filter(record => !capability.cases.includes(record))));
    card.append(detail);
  }
  if (capability.pending.length) {
    const detail = disclosure("待核线索 · " + capability.pending.length + " 条贡献");
    detail.append(evidenceList(capability.pending));
    card.append(detail);
  }
  return card;
}

function projectCard(match) {
  const card = element("article", undefined, "project");
  const head = element("div", undefined, "card-head");
  head.append(element("h3", match.title), element("span", recommendations[match.status], "badge " + match.status));
  card.append(head, element("p", match.scope, "muted"),
    element("p", match.covered + " / " + match.requirements.length + " 项必需能力已跨项目复现", "muted"));
  for (const item of match.requirements) {
    const capability = item.capability;
    const detail = disclosure(capability.label + " · " + levels[capability.level].label);
    detail.querySelector("summary").append(element("span", item.need, "requirement"));
    detail.append(element("p", "项目验证 · " + item.gap, "gap"));
    if (levels[capability.level].gap) detail.append(element("p", levels[capability.level].gap, "gap"));
    if (capability.cases.length) detail.append(evidenceList(capability.cases));
    if (capability.pending.length) {
      detail.append(element("p", "待核线索", "muted"), evidenceList(capability.pending));
    }
    card.append(detail);
  }
  return card;
}

function render(through) {
  const review = buildReview(demo, through);
  const outcome = document.getElementById("outcome");
  outcome.textContent = demo.subject + " · " + review.projects + " 个项目 · " + review.hosts + " 个模拟宿主有已核来源";
  const traits = Object.entries(demo.projects).flatMap(([project, title]) => {
    const signals = review.capabilities.flatMap(capability => {
      const evidence = capability.cases.find(record => record.project === project);
      return evidence ? [{ evidence, capability }] : [];
    });
    if (!signals.length) return [];
    const card = element("article");
    card.append(element("h3", title));
    for (const signal of signals) {
      const detail = disclosure(signal.capability.label);
      detail.append(evidenceList([signal.evidence]));
      card.append(detail);
    }
    return [card];
  });
  document.getElementById("trait-cards").replaceChildren(...traits);
  document.getElementById("capability-cards").replaceChildren(...review.capabilities.map(capabilityCard));
  document.getElementById("project-cards").replaceChildren(...review.matches.map(projectCard));
}

for (const [index, stage] of demo.stages.entries()) {
  const option = element("option", stage.label + " · " + stage.end);
  option.value = String(index);
  period.append(option);
}
period.value = String(demo.stages.length - 1);
period.addEventListener("change", () => render(Number(period.value)));
render(Number(period.value));
</script>
</body>
</html>
